name: Eval PR Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-eval:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run full behavior regression with coverage
        run: >-
          python -m coverage run -m unittest discover -s tests -v
      - name: Report coverage (observation only)
        run: python -m coverage report --precision=2
      - name: Validate Eval case schemas
        run: >-
          python -m evals.runner
          --schema-only
          --gate
          --run-root "${{ runner.temp }}\agent-study-evals-schema"
      - name: Run deterministic Eval suite
        run: >-
          python -m evals.runner
          --dry-run
          --gate
          --run-root "${{ runner.temp }}\agent-study-evals-dry"
      - name: Run repository privacy check
        run: python scripts/check_privacy.py
