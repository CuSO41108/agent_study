name: Privacy Guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan tracked repository
        run: python scripts/check_privacy.py
